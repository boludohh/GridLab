build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false

complexity:
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 8
    constructorThreshold: 10
  TooManyFunctions:
    active: true
    thresholdInFiles: 20
    thresholdInClasses: 20
    thresholdInInterfaces: 15
    thresholdInObjects: 20
    thresholdInEnums: 10
  ComplexCondition:
    active: true
    threshold: 4
  LargeClass:
    active: true
    threshold: 400
  NestedBlockDepth:
    active: true
    threshold: 4
  CyclomaticComplexMethod:
    active: true
    threshold: 15

coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true

empty-blocks:
  active: true

exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: true

naming:
  active: true
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Za-z0-9]*'
  VariableNaming:
    active: true

performance:
  active: true

style:
  active: true
  MagicNumber:
    active: false
  WildcardImport:
    active: true
  MaxLineLength:
    active: true
    maxLineLength: 120
  ReturnCount:
    active: true
    max: 3
  ThrowsCount:
    active: true
    max: 3
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  NewLineAtEndOfFile:
    active: true

formatting:
  active: true
  android: true
  autoCorrect: false
  Indentation:
    active: true
    indentSize: 4
  NoWildcardImports:
    active: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
