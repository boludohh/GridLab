name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile only
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.reference != 'refs/heads/main' && github.reference != 'refs/heads/master' }}

      - name: Decode keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore/gridlab-release.jks

      - name: Create keystore.properties
        run: |
          {
            echo "storeFile=keystore/gridlab-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_STORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEYSTORE_KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEYSTORE_KEY_PASSWORD }}"
          } > app/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile debug
        run: ./gradlew :app:assembleDebug --stacktrace